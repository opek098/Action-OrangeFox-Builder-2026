name: OrangeFox Universal Builder

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: "Branch OrangeFox (14.1, 12.1, 11.0, dst)"
        required: true
        default: "14.1"
      DEVICE_TREE:
        description: "URL device tree (https://github.com/user/repo)"
        required: true
      DEVICE_TREE_BRANCH:
        description: "Branch device tree"
        required: true
      DEVICE_PATH:
        description: "Path tujuan di source (contoh: device/infinix/X6895)"
        required: true
      DEVICE_NAME:
        description: "Codename device (contoh: X6895)"
        required: true
      EXTRA_TREES:
        description: "Tree tambahan, satu per baris: URL BRANCH PATH (common, vendor, kernel, dll)"
        required: false
        default: ""
      LUNCH_PREFIX:
        description: "Prefix lunch (twrp / omni)"
        required: true
        default: "twrp"
      LUNCH_VARIANT:
        description: "Varian lunch (auto = ap2a-eng untuk 14.x, eng untuk branch lama)"
        required: true
        default: "auto"
      BUILD_TARGET:
        description: "Target build"
        required: true
        default: "vendorbootimage"
        type: choice
        options:
          - vendorbootimage
          - bootimage
          - recoveryimage
      JAVA_VERSION:
        description: "Versi JDK (17 untuk Android 14, 11 untuk 12.1/11)"
        required: true
        default: "17"
      PRE_BUILD_CMD:
        description: "Perintah opsional sebelum build (dijalankan di root source)"
        required: false
        default: ""
      RELEASE:
        description: "Upload ke Releases (kalau false, hanya artifact)"
        required: true
        default: true
        type: boolean

jobs:
  build:
    name: build
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      WORKDIR: /home/runner/builder
      SSH_KEY: ${{ secrets.SSH_KEY }}
      TREE_TOKEN: ${{ secrets.TREE_TOKEN }}
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      DEVICE_TREE: ${{ inputs.DEVICE_TREE }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
      DEVICE_PATH: ${{ inputs.DEVICE_PATH }}
      DEVICE_NAME: ${{ inputs.DEVICE_NAME }}
      EXTRA_TREES: ${{ inputs.EXTRA_TREES }}
      LUNCH_PREFIX: ${{ inputs.LUNCH_PREFIX }}
      LUNCH_VARIANT: ${{ inputs.LUNCH_VARIANT }}
      BUILD_TARGET: ${{ inputs.BUILD_TARGET }}
      PRE_BUILD_CMD: ${{ inputs.PRE_BUILD_CMD }}

    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Cleanup
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Initialize workspace
        run: |
          mkdir -p $WORKDIR/fox
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Prepare the build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
            unzip fontconfig python3 python-is-python3 bc cpio rsync \
            ccache lz4 libssl-dev aria2 repo

      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.JAVA_VERSION }}

      - name: Setup SSH Keys
        if: env.SSH_KEY != ''
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Sync OrangeFox sources and minimal manifest
        run: |
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git $WORKDIR/sync
          cd $WORKDIR/sync
          ./orangefox_sync.sh --branch "$MANIFEST_BRANCH" --path $WORKDIR/fox

      - name: Clone device tree
        run: |
          URL="$DEVICE_TREE"
          if [ -n "$TREE_TOKEN" ]; then
            URL="${URL/https:\/\//https:\/\/x-access-token:$TREE_TOKEN@}"
          fi
          git clone --depth=1 -b "$DEVICE_TREE_BRANCH" "$URL" "$WORKDIR/fox/$DEVICE_PATH"

      - name: Clone common tree
        if: inputs.EXTRA_TREES != ''
        run: |
          echo "$EXTRA_TREES" | while read -r URL BRANCH TPATH; do
            [ -z "$URL" ] && continue
            if [ -n "$TREE_TOKEN" ]; then
              URL="${URL/https:\/\//https:\/\/x-access-token:$TREE_TOKEN@}"
            fi
            git clone --depth=1 -b "$BRANCH" "$URL" "$WORKDIR/fox/$TPATH"
          done

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Building recovery
        run: |
          cd $WORKDIR/fox
          if [ -n "$PRE_BUILD_CMD" ]; then bash -c "$PRE_BUILD_CMD"; fi
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 10G
          set +e
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE="$DEVICE_NAME"
          export LC_ALL=C
          VARIANT="$LUNCH_VARIANT"
          if [ "$VARIANT" = "auto" ]; then
            case "$MANIFEST_BRANCH" in
              14*) VARIANT="ap2a-eng" ;;
              *)   VARIANT="eng" ;;
            esac
          fi
          echo "Lunch: ${LUNCH_PREFIX}_${DEVICE_NAME}-${VARIANT}"
          lunch "${LUNCH_PREFIX}_${DEVICE_NAME}-${VARIANT}"
          mka adbd "$BUILD_TARGET" -j$(nproc --all)

      - name: Check the output directory before uploading
        run: |
          OUT=$WORKDIR/fox/out/target/product/$DEVICE_NAME
          ls -lh "$OUT"
          mkdir -p $GITHUB_WORKSPACE/release
          cp -v "$OUT"/OrangeFox*.zip $GITHUB_WORKSPACE/release/ 2>/dev/null || true
          cp -v "$OUT"/OrangeFox*.img $GITHUB_WORKSPACE/release/ 2>/dev/null || true
          cp -v "$OUT"/vendor_boot.img "$OUT"/boot.img "$OUT"/recovery.img \
            $GITHUB_WORKSPACE/release/ 2>/dev/null || true
          ls -lh $GITHUB_WORKSPACE/release
          [ "$(ls -A $GITHUB_WORKSPACE/release)" ] || { echo "Tidak ada output"; exit 1; }

      - name: Upload to Release
        if: inputs.RELEASE
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          name: OrangeFox ${{ inputs.MANIFEST_BRANCH }} ${{ inputs.DEVICE_NAME }} #${{ github.run_number }}
          tag_name: fox-${{ inputs.DEVICE_NAME }}-${{ github.run_number }}
          body: |
            OrangeFox ${{ inputs.MANIFEST_BRANCH }} untuk ${{ inputs.DEVICE_NAME }}
            Device tree: ${{ inputs.DEVICE_TREE }} (${{ inputs.DEVICE_TREE_BRANCH }})
            Target: ${{ inputs.BUILD_TARGET }}

      - name: Upload artifact
        if: ${{ !inputs.RELEASE }}
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-${{ inputs.DEVICE_NAME }}-${{ inputs.MANIFEST_BRANCH }}
          path: release/*
          
